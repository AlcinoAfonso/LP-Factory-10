name: PR 828 — Aplicar delta documental do Schema

on:
  push:
    branches:
      - fix/postgrest-domain-conflict-sqlstate
    paths:
      - reports/pr828-schema.json
      - .github/workflows/pr828-schema-doc.yml

permissions:
  contents: write

concurrency:
  group: pr828-schema-doc
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[pr828-doc-applied]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply canonical documentation report
        run: |
          npm ci --prefix automations/docs-apply-report
          npm run check --prefix automations/docs-apply-report
          node automations/docs-apply-report/run.mjs "${GITHUB_WORKSPACE}/reports/pr828-schema.json"

      - name: Remove transient execution files
        run: |
          rm reports/pr828-schema.json
          rm .github/workflows/pr828-schema-doc.yml

      - name: Validate and commit final delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/schema.md reports/pr828-schema.json .github/workflows/pr828-schema-doc.yml
          git diff --cached --check
          git commit -m "docs(schema): registrar conflitos seguros do PostgREST [pr828-doc-applied]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
