name: Pipeline Supabase — Apply Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      migration_scope:
        description: "Escopo manual autorizado"
        required: true
        type: choice
        options:
          - e25_1_only
          - e10_11_only
          - e22_7_only
          - e23_5_only
          - e10_12_only
      expected_main_sha:
        description: "SHA exato da main apos merge autorizado"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pipeline-supabase-apply-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: dpikmjgiteuafsbaubue
      SUPABASE_MIGRATIONS_DIR: supabase/migrations
      SUPABASE_APPLY_MIGRATIONS_ENABLED: ${{ vars.SUPABASE_APPLY_MIGRATIONS_ENABLED }}
      EVENT_BEFORE_SHA: ${{ github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report disabled migration gate
        if: ${{ vars.SUPABASE_APPLY_MIGRATIONS_ENABLED != 'true' }}
        shell: bash
        run: |
          {
            echo "## Pipeline Supabase — Apply Migrations"
            echo ""
            echo "- branch: \`${GITHUB_REF_NAME}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- evento: \`${GITHUB_EVENT_NAME}\`"
            echo "- apply habilitado: \`false\`"
            echo "- status final: \`skipped\`"
            echo ""
            echo "### Gate de migrations"
            echo ""
            echo "- Apply nao executado porque \`SUPABASE_APPLY_MIGRATIONS_ENABLED\` nao esta definido como \`true\`."
            echo "- Supabase CLI, \`supabase link\` e \`supabase db push\` nao foram executados."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Block unscoped migration apply
        if: ${{ vars.SUPABASE_APPLY_MIGRATIONS_ENABLED == 'true' && github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          echo "Apply automatico suspenso: E10.10 permanece fora do escopo E25.1. Revisar o workflow antes de retomar o fluxo integral." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Setup Supabase CLI
        if: ${{ vars.SUPABASE_APPLY_MIGRATIONS_ENABLED == 'true' }}
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.106.0

      - name: Apply migrations
        if: ${{ vars.SUPABASE_APPLY_MIGRATIONS_ENABLED == 'true' && github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          APPLY_SCOPE: ${{ inputs.migration_scope }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -uo pipefail

          status="success"
          failure_step=""
          changed_migrations=""
          dry_run_migrations=""
          staged_migrations=""
          apply_enabled="${SUPABASE_APPLY_MIGRATIONS_ENABLED:-false}"

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF_NAME" != "main" ] || { [ "$APPLY_SCOPE" != "e25_1_only" ] && [ "$APPLY_SCOPE" != "e10_11_only" ] && [ "$APPLY_SCOPE" != "e22_7_only" ] && [ "$APPLY_SCOPE" != "e23_5_only" ] && [ "$APPLY_SCOPE" != "e10_12_only" ]; } || [[ ! "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$EXPECTED_MAIN_SHA" != "$GITHUB_SHA" ]; then
            status="failure"
            failure_step="manual scope, main ref, or exact post-merge SHA"
          fi

          if [ "$apply_enabled" != "true" ]; then
            status="failure"
            failure_step="baseline gate disabled"
          fi

          if [ "$status" = "success" ] && [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            status="failure"
            failure_step="missing SUPABASE_ACCESS_TOKEN"
          fi

          if [ "$status" = "success" ] && [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            status="failure"
            failure_step="missing SUPABASE_DB_PASSWORD"
          fi

          if [ "$status" = "success" ] && [ ! -d "$SUPABASE_MIGRATIONS_DIR" ]; then
            status="failure"
            failure_step="missing migrations directory"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${EVENT_BEFORE_SHA:-}" ] && [ "${EVENT_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            changed_migrations="$(git diff --name-only "${EVENT_BEFORE_SHA}" "${GITHUB_SHA}" -- supabase/migrations || true)"
          else
            changed_migrations="(manual run or initial push; diff not computed)"
          fi

          if [ -z "${changed_migrations}" ]; then
            changed_migrations="(no changed migration file detected by diff)"
          fi

          if [ "$status" = "success" ]; then
            stage_root="$(mktemp -d "$RUNNER_TEMP/scoped-migrations.XXXXXX")" || {
              status="failure"
              failure_step="temporary project creation"
            }
          fi

          if [ "$status" = "success" ]; then
            stage_project="$stage_root/project"
            mkdir -p "$stage_project/supabase/migrations"
            cp supabase/config.toml "$stage_project/supabase/config.toml"
            mapfile -t all_migrations < <(find "$SUPABASE_MIGRATIONS_DIR" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort)
            historical_count=0
            e10_count=0
            e25_count=0
            e1011_count=0
            e227_count=0
            e235_count=0
            e1012_count=0
            for name in "${all_migrations[@]}"; do
              case "$name" in
                20260926145500_e10_10_account_factual_profile.sql|20260926171100_e10_10_factual_catalog_cutover.sql)
                  e10_count=$((e10_count + 1))
                  ;;
                20260927145500_e25_1_account_communication_bases.sql|20260927163500_e21_2_communication_base_workloads.sql)
                  cp "$SUPABASE_MIGRATIONS_DIR/$name" "$stage_project/supabase/migrations/$name"
                  e25_count=$((e25_count + 1))
                  ;;
                20260928161504_e10_11_pending_setup_business_name.sql)
                  if [ "$APPLY_SCOPE" = "e10_11_only" ] || [ "$APPLY_SCOPE" = "e22_7_only" ] || [ "$APPLY_SCOPE" = "e23_5_only" ] || [ "$APPLY_SCOPE" = "e10_12_only" ]; then
                    cp "$SUPABASE_MIGRATIONS_DIR/$name" "$stage_project/supabase/migrations/$name"
                  fi
                  e1011_count=$((e1011_count + 1))
                  ;;
                20261001030000_e22_7_retire_factual_authority.sql)
                  if [ "$APPLY_SCOPE" = "e22_7_only" ] || [ "$APPLY_SCOPE" = "e23_5_only" ] || [ "$APPLY_SCOPE" = "e10_12_only" ]; then
                    cp "$SUPABASE_MIGRATIONS_DIR/$name" "$stage_project/supabase/migrations/$name"
                  fi
                  e227_count=$((e227_count + 1))
                  ;;
                20261005170954_e23_5_retire_unused_graphql.sql)
                  if [ "$APPLY_SCOPE" = "e23_5_only" ] || [ "$APPLY_SCOPE" = "e10_12_only" ]; then
                    cp "$SUPABASE_MIGRATIONS_DIR/$name" "$stage_project/supabase/migrations/$name"
                  fi
                  e235_count=$((e235_count + 1))
                  ;;
                20261007153217_e10_12_account_context_attendance.sql|20261009171607_e10_12_sales_attendance.sql|20261009204000_e10_12_restrict_attendance_commit_acl.sql)
                  if [ "$APPLY_SCOPE" = "e10_12_only" ]; then
                    cp "$SUPABASE_MIGRATIONS_DIR/$name" "$stage_project/supabase/migrations/$name"
                  fi
                  e1012_count=$((e1012_count + 1))
                  ;;
                *)
                  version="${name%%_*}"
                  if [[ ! "$version" =~ ^[0-9]{14}$ ]] || [[ "$version" > "20260926111926" ]]; then
                    status="failure"
                    failure_step="unexpected migration in selective inventory"
                    break
                  fi
                  cp "$SUPABASE_MIGRATIONS_DIR/$name" "$stage_project/supabase/migrations/$name"
                  historical_count=$((historical_count + 1))
                  ;;
              esac
            done
            if [ "${#all_migrations[@]}" -ne 66 ] || [ "$historical_count" -ne 56 ] || [ "$e10_count" -ne 2 ] || [ "$e25_count" -ne 2 ] || [ "$e1011_count" -ne 1 ] || [ "$e227_count" -ne 1 ] || [ "$e235_count" -ne 1 ] || [ "$e1012_count" -ne 3 ]; then
              status="failure"
              failure_step="selective migration inventory differs from 56 historical + 2 E10.10 + 2 E25 + 1 E10.11 + 1 E22.7 + 1 E23.5 + 3 E10.12"
            fi
            if [ "$status" = "success" ]; then
              for name in "${all_migrations[@]}"; do
                if [ -f "$stage_project/supabase/migrations/$name" ] && ! cmp -s "$SUPABASE_MIGRATIONS_DIR/$name" "$stage_project/supabase/migrations/$name"; then
                  status="failure"
                  failure_step="staged migration differs from source"
                  break
                fi
              done
              staged_migrations="$(find "$stage_project/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort)"
              expected_staged_count=58
              if [ "$APPLY_SCOPE" = "e10_11_only" ]; then expected_staged_count=59; fi
              if [ "$APPLY_SCOPE" = "e22_7_only" ]; then expected_staged_count=60; fi
              if [ "$APPLY_SCOPE" = "e23_5_only" ]; then expected_staged_count=61; fi
              if [ "$APPLY_SCOPE" = "e10_12_only" ]; then expected_staged_count=64; fi
              if [ "$(printf '%s\n' "$staged_migrations" | wc -l)" -ne "$expected_staged_count" ]; then
                status="failure"
                failure_step="staged migration count"
              fi
            fi
          fi

          if [ "$status" = "success" ]; then
            supabase --workdir "$stage_project" link --project-ref "$SUPABASE_PROJECT_REF" || {
              status="failure"
              failure_step="supabase link in staged project"
            }
          fi

          if [ "$status" = "success" ]; then
            if dry_run_output="$(supabase --workdir "$stage_project" db push --linked --dry-run 2>&1)"; then
              dry_run_migrations="$(printf '%s\n' "$dry_run_output" | sed -n -E 's/^[[:space:]]*•[[:space:]]*([0-9]{14}_[[:alnum:]_]+\.sql)$/\1/p')"
              if [ "$APPLY_SCOPE" = "e10_11_only" ]; then
                expected_migrations='20260928161504_e10_11_pending_setup_business_name.sql'
              elif [ "$APPLY_SCOPE" = "e22_7_only" ]; then
                expected_migrations='20261001030000_e22_7_retire_factual_authority.sql'
              elif [ "$APPLY_SCOPE" = "e23_5_only" ]; then
                expected_migrations='20261005170954_e23_5_retire_unused_graphql.sql'
              elif [ "$APPLY_SCOPE" = "e10_12_only" ]; then
                expected_migrations='20261009204000_e10_12_restrict_attendance_commit_acl.sql'
              else
                expected_migrations="$(printf '%s\n%s' '20260927145500_e25_1_account_communication_bases.sql' '20260927163500_e21_2_communication_base_workloads.sql')"
              fi
              if [ "$dry_run_migrations" != "$expected_migrations" ]; then
                status="failure"
                failure_step="dry-run pending migrations differ from selected scope"
              fi
            else
              status="failure"
              failure_step="supabase db push dry-run"
            fi
          fi

          if [ "$status" = "success" ]; then
            supabase --workdir "$stage_project" db push --linked --yes || {
              status="failure"
              failure_step="supabase db push in staged project"
            }
          fi

          {
            echo "## Pipeline Supabase — Apply Migrations"
            echo ""
            echo "- branch: \`${GITHUB_REF_NAME}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- projeto alvo: \`${SUPABASE_PROJECT_REF}\`"
            echo "- diretório de migrations: \`${SUPABASE_MIGRATIONS_DIR}\`"
            echo "- escopo: \`${APPLY_SCOPE}\`"
            echo "- SHA autorizado: \`${EXPECTED_MAIN_SHA}\`"
            echo "- evento: \`${GITHUB_EVENT_NAME}\`"
            echo "- apply habilitado: \`${apply_enabled}\`"
            echo "- status final: \`${status}\`"
            echo ""
            echo "### Migrations alteradas"
            echo ""
            echo '```text'
            printf '%s\n' "$changed_migrations"
            echo '```'
            echo ""
            echo "### Pendencias confirmadas no dry-run antes do apply"
            echo ""
            echo '```text'
            printf '%s\n' "$dry_run_migrations"
            echo '```'
            echo ""
            echo "- staging: 56 historicas + 2 E25; E10.11 nos escopos e10_11_only/e22_7_only/e23_5_only; E22.7 nos escopos e22_7_only/e23_5_only; E23.5 somente em e23_5_only; as 2 E10.10 foram excluidas."
            echo "- apply posterior integral permanece suspenso ate resolucao separada de E10.10."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" != "success" ]; then
            {
              echo ""
              echo "### Etapa que falhou"
              echo ""
              echo "- \`${failure_step}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
