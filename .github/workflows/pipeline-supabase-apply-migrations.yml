name: Pipeline Supabase — Apply Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pipeline-supabase-apply-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: dpikmjgiteuafsbaubue
      SUPABASE_MIGRATIONS_DIR: supabase/migrations
      EVENT_BEFORE_SHA: ${{ github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.106.0

      - name: Apply migrations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          status="failure"
          failure_step="post-merge identity"
          authorized_pr=""
          expected_migrations=""
          dry_run_migrations=""
          applied="false"
          report() {
            {
              echo "## Pipeline Supabase — Apply Migrations"
              echo "- branch: $GITHUB_REF_NAME"
              echo "- commit: $GITHUB_SHA"
              echo "- projeto alvo: $SUPABASE_PROJECT_REF"
              echo "- evento: $GITHUB_EVENT_NAME"
              echo "- PR mergeado: $authorized_pr"
              echo "- status final: $status"
              echo "- apply executado: $applied"
              echo "- etapa: $failure_step"
              echo ""
              echo "### Migrations acrescentadas na entrega"
              printf '%s\n' "$expected_migrations"
              echo ""
              echo "### Pendencias confirmadas antes do apply"
              printf '%s\n' "$dry_run_migrations"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap report EXIT

          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_NAME" = "main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EVENT_BEFORE_SHA" != "0000000000000000000000000000000000000000"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$EVENT_BEFORE_SHA" "$GITHUB_SHA"
          authorized_pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq ".[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$GITHUB_SHA\") | .number")"
          [[ "$authorized_pr" =~ ^[0-9]+$ ]]

          failure_step="delivery diff and immutable history"
          changes="$(git diff --no-renames --name-status "$EVENT_BEFORE_SHA" "$GITHUB_SHA" -- "$SUPABASE_MIGRATIONS_DIR")"
          previous_migrations="$(git ls-tree -r --name-only "$EVENT_BEFORE_SHA" -- "$SUPABASE_MIGRATIONS_DIR")"
          while IFS=$'\t' read -r change file; do
            [ -n "$change" ] || continue
            [[ "$file" =~ ^supabase/migrations/[0-9]{14}_[[:alnum:]_]+\.sql$ ]]
            case "$change" in
              A)
                name="${file##*/}"
                [[ ! "$previous_migrations" =~ /${name%%_*}_ ]]
                expected_migrations+="$name"$'\n'
                ;;
              D) ;; # The CLI must confirm deleted candidates are absent from remote history.
              *) echo "Existing migration changed: $file" >&2; exit 1 ;;
            esac
          done <<< "$changes"
          expected_migrations="$(printf '%s' "$expected_migrations" | LC_ALL=C sort)"

          failure_step="active migration filenames and versions"
          declare -A versions=()
          for file in "$SUPABASE_MIGRATIONS_DIR"/*; do
            name="${file##*/}"
            test -f "$file"
            test ! -L "$file"
            [[ "$name" =~ ^([0-9]{14})_[[:alnum:]_]+\.sql$ ]]
            version="${BASH_REMATCH[1]}"
            test -z "${versions[$version]:-}"
            versions[$version]=1
          done

          failure_step="credentials"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"

          failure_step="supabase link"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          # Parse the pinned CLI output; an unknown/partial format is never a no-op.
          pending_migrations() {
            local output names line
            output="$(supabase db push --linked --dry-run 2>&1)" || return 1
            ! grep -q "Skipping migration" <<< "$output" || return 1
            if grep -Fxq "Remote database is up to date." <<< "$output"; then
              ! grep -Eq '•|Would push these migrations:' <<< "$output"
              return
            fi
            grep -Fxq "Would push these migrations:" <<< "$output" || return 1
            names="$(sed -n '/^[[:space:]]*•/p' <<< "$output")"
            test -n "$names" || return 1
            while IFS= read -r line; do
              [[ "$line" =~ ^[[:space:]]*•[[:space:]]*([0-9]{14}_[[:alnum:]_]+\.sql)$ ]] || return 1
              printf '%s\n' "${BASH_REMATCH[1]}"
            done <<< "$names"
          }

          failure_step="dry-run and remote history compatibility"
          dry_run_migrations="$(pending_migrations)"
          failure_step="unexpected pending migration"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            grep -Fxq -- "$name" <<< "$expected_migrations"
          done <<< "$dry_run_migrations"

          if [ -n "$dry_run_migrations" ]; then
            failure_step="supabase db push"
            applied="true"
            supabase db push --linked --yes
            failure_step="post-apply pending verification"
            remaining="$(pending_migrations)"
            test -z "$remaining"
          fi
          status="success"
          failure_step="complete"
