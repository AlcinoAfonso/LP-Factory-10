name: Temporary E19 reference scan
on:
  push:
    branches:
      - agent/ajustar-roadmap-e19-template
permissions:
  contents: write
jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ajustar-roadmap-e19-template
          fetch-depth: 0
      - name: Scan markdown references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== E19.2 / E19.3 explicit references ==='
          grep -RInE 'E19\.(2|3)|(^|[^0-9])19\.(2|3)([^0-9]|$)' README.md docs --include='*.md' || true
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-scan-e19-refs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-scan-e19-refs.yml
          git commit -m 'chore: remove temporary E19 reference scan'
          git push origin HEAD:agent/ajustar-roadmap-e19-template