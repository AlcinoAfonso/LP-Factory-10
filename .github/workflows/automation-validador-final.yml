name: Automation Validador Final

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL manual do app para o fluxo determinístico"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: automation-validador-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automations/validador-final

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore state cache
        id: restore-state
        uses: actions/cache/restore@v5
        with:
          path: automations/validador-final/state/test-account.json
          key: automation-validador-final-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            automation-validador-final-state-${{ github.ref_name }}-

      - name: Sanitize restored state
        working-directory: .
        run: |
          mkdir -p automations/validador-final/state
          node <<'NODE'
          const fs = require("node:fs");
          const statePath = "automations/validador-final/state/test-account.json";
          let restored = {};
          try {
            if (fs.existsSync(statePath)) {
              restored = JSON.parse(fs.readFileSync(statePath, "utf-8"));
            }
          } catch {
            restored = {};
          }
          const sanitized = {
            email: typeof restored.email === "string" ? restored.email : "",
            status: typeof restored.status === "string" ? restored.status : "empty",
            sequence: Number.isInteger(restored.sequence) ? restored.sequence : 30,
            last_updated_at: restored.last_updated_at ?? null,
          };
          fs.writeFileSync(statePath, `${JSON.stringify(sanitized, null, 2)}\n`, "utf-8");
          NODE

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install deps (isolated subproject)
        run: npm ci

      - name: Check automation subproject
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run validador final
        env:
          APP_URL_OVERRIDE: ${{ inputs.app_url }}
          MAILBOX_EMAIL: ${{ secrets.MAILBOX_EMAIL }}
          MAILBOX_PASSWORD: ${{ secrets.MAILBOX_PASSWORD }}
        run: npm run start

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: automations/validador-final/state/test-account.json
          key: automation-validador-final-state-${{ github.ref_name }}-${{ github.run_id }}
