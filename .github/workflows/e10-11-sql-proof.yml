name: E10.11 — SQL proof

on:
  pull_request:
    paths:
      - '.github/workflows/e10-11-sql-proof.yml'
      - 'supabase/migrations/20260928161504_e10_11_pending_setup_business_name.sql'
      - 'supabase/migrations/20261007153217_e10_12_account_context_attendance.sql'
      - 'supabase/tests/e10_12_initial_attendance.*'
      - 'supabase/tests/e10_12_sales_attendance.*'
      - 'supabase/migrations/20261009171607_e10_12_sales_attendance.sql'
      - 'supabase/migrations/20261009204000_e10_12_restrict_attendance_commit_acl.sql'
      - 'supabase/tests/e10_11_pending_setup_business_name.test.sql'
      - 'supabase/migrations/20261001030000_e22_7_retire_factual_authority.sql'
      - 'supabase/tests/e22_7_retire_factual_authority.*'
      - 'supabase/migrations/20261005170954_e23_5_retire_unused_graphql.sql'
      - 'supabase/tests/e23_5_retire_unused_graphql.*'
      - 'supabase/migrations/20261010202505_e25_3_communication_resources.sql'
      - 'supabase/tests/e25_3_communication_resources.test.sql'

permissions:
  contents: read

jobs:
  sql-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex-app/e10-11-passagem-base' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.106.0

      - name: Stage the E10.11 schema dependency chain
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(mktemp -d "$RUNNER_TEMP/e10-11-sql.XXXXXX")"
          stage_project="$stage_root/project"
          mkdir -p "$stage_project/supabase/migrations"
          cp supabase/config.toml "$stage_project/supabase/config.toml"
          mapfile -t all_migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort)
          test "${#all_migrations[@]}" -eq 61
          selected=(
            20260611172930_remote_public_baseline.sql
            20260614124000_fix_audit_context_event_event_column.sql
            20260628184945_e9_commercial_entitlements.sql
            20260920223653_e10_9_pending_setup_conversation.sql
            20260921170115_e10_9_pending_setup_openai_call_counter.sql
            20260927145500_e25_1_account_communication_bases.sql
            20260928161504_e10_11_pending_setup_business_name.sql
          )
          for name in "${selected[@]}"; do
            test -f "supabase/migrations/$name"
            cp "supabase/migrations/$name" "$stage_project/supabase/migrations/$name"
          done
          test "$(find "$stage_project/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 7
          for staged_file in "$stage_project"/supabase/migrations/*.sql; do
            cmp -s "$staged_file" "supabase/migrations/${staged_file##*/}"
          done
          echo "project=$stage_project" >> "$GITHUB_OUTPUT"
          echo "Staged exact baseline, audit fix, E9 entitlement, E10.9, E25.1 Base, and E10.11 SQL. Historical data-gated migrations and E10.10 are outside this focused proof." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations to isolated local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "${{ steps.stage.outputs.project }}" start \
            -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/e10-11-supabase-start.log" 2>&1 || {
              last_migration_line="$(grep -n 'Applying migration ' "$RUNNER_TEMP/e10-11-supabase-start.log" | tail -n 1 | cut -d: -f1 || true)"
              if [ -n "$last_migration_line" ]; then
                sed -n "${last_migration_line},$((last_migration_line + 20))p" \
                  "$RUNNER_TEMP/e10-11-supabase-start.log"
              else
                sed -n '1,25p' "$RUNNER_TEMP/e10-11-supabase-start.log"
              fi | sed -E '/(SERVICE_ROLE|ANON_KEY|SECRET_KEY|JWT_SECRET|DB_PASSWORD|DATABASE_URL|PUBLISHABLE_KEY)/Id'
              exit 1
            }
          echo "Isolated local PostgreSQL accepted the focused E10.11 schema chain." >> "$GITHUB_STEP_SUMMARY"

      - name: Assert migration history and run rollback SQL cases
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t db_containers < <(docker ps --format '{{.Names}}' | grep '^supabase_db_' || true)
          test "${#db_containers[@]}" -eq 1
          db_container="${db_containers[0]}"
          history_ok="$(docker exec "$db_container" psql -U postgres -d postgres -At -v ON_ERROR_STOP=1 -c "select count(*) = 7 and count(*) filter (where version = '20260928161504') = 1 and count(*) filter (where version in ('20260926145500','20260926171100')) = 0 from supabase_migrations.schema_migrations")"
          test "$history_ok" = t
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/e10_11_pending_setup_business_name.test.sql \
            > "$RUNNER_TEMP/e10-11-sql-test.log" 2>&1 || {
              tail -n 60 "$RUNNER_TEMP/e10-11-sql-test.log"
              exit 1
            }
          grep -qx 'ROLLBACK' "$RUNNER_TEMP/e10-11-sql-test.log"
          echo "E10.11 positive/negative SQL cases passed and rolled back." >> "$GITHUB_STEP_SUMMARY"

  e22-7-sql-proof:
    name: ${{ github.event.pull_request.head.ref == 'codex-app/e23-5-retirada-graphql' && 'E23.5 GraphQL SQL proof' || 'E22.7 terminal SQL proof' }}
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'codex-app/e22-7-retirada-terminal' || github.event.pull_request.head.ref == 'codex-app/e23-5-retirada-graphql') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.106.0
      - name: Stage the canonical E21 dependency chain
        if: ${{ github.event.pull_request.head.ref == 'codex-app/e22-7-retirada-terminal' }}
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(mktemp -d "$RUNNER_TEMP/e22-7-sql.XXXXXX")"
          stage_project="$stage_root/project"
          mkdir -p "$stage_project/supabase/migrations"
          cp supabase/config.toml "$stage_project/supabase/config.toml"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 62
          selected=(
            20260611172930_remote_public_baseline.sql
            20260614124000_fix_audit_context_event_event_column.sql
            20260820190422_e21_2_3_openai_workload_operational_configurations.sql
            20260820213900_e21_2_taxon_input_catalog_sufficiency_workload.sql
          )
          for name in "${selected[@]}"; do
            cp "supabase/migrations/$name" "$stage_project/supabase/migrations/$name"
            cmp -s "supabase/migrations/$name" "$stage_project/supabase/migrations/$name"
          done
          test "$(find "$stage_project/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 4
          echo "project=$stage_project" >> "$GITHUB_OUTPUT"
          echo "Four exact canonical dependencies staged. E22.7 is tested integrally after a disposable fixture; no E10.10 migration is staged or applied." >> "$GITHUB_STEP_SUMMARY"
      - name: Start isolated PostgreSQL 17
        if: ${{ github.event.pull_request.head.ref == 'codex-app/e22-7-retirada-terminal' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "${{ steps.stage.outputs.project }}" start \
            -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/e22-7-supabase-start.log" 2>&1 || {
              last_migration_line="$(grep -n 'Applying migration ' "$RUNNER_TEMP/e22-7-supabase-start.log" | tail -n 1 | cut -d: -f1 || true)"
              if [ -n "$last_migration_line" ]; then
                sed -n "${last_migration_line},$((last_migration_line + 20))p" "$RUNNER_TEMP/e22-7-supabase-start.log"
              else
                sed -n '1,25p' "$RUNNER_TEMP/e22-7-supabase-start.log"
              fi | sed -E '/(SERVICE_ROLE|ANON_KEY|SECRET_KEY|JWT_SECRET|DB_PASSWORD|DATABASE_URL|PUBLISHABLE_KEY)/Id'
              exit 1
            }
      - name: Execute full migration and terminal rollback cases
        if: ${{ github.event.pull_request.head.ref == 'codex-app/e22-7-retirada-terminal' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t db_containers < <(docker ps --format '{{.Names}}' | grep '^supabase_db_' || true)
          test "${#db_containers[@]}" -eq 1
          test "$(docker exec "${db_containers[0]}" psql -U postgres -d postgres -At -c 'select current_setting('"'"'server_version_num'"'"')::int / 10000 = 17')" = t
          bash supabase/tests/e22_7_retire_factual_authority.proof.sh "${db_containers[0]}"

      - name: Stage the E23.5 isolated schema baseline
        if: ${{ github.event.pull_request.head.ref == 'codex-app/e23-5-retirada-graphql' }}
        id: stage_graphql
        shell: bash
        run: |
          set -euo pipefail
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 63
          stage_root="$(mktemp -d "$RUNNER_TEMP/e23-5-sql.XXXXXX")"
          stage_project="$stage_root/project"
          mkdir -p "$stage_project/supabase/migrations"
          cp supabase/config.toml "$stage_project/supabase/config.toml"
          for name in 20260611172930_remote_public_baseline.sql 20260614124000_fix_audit_context_event_event_column.sql; do
            cp "supabase/migrations/$name" "$stage_project/supabase/migrations/$name"
            cmp -s "supabase/migrations/$name" "$stage_project/supabase/migrations/$name"
          done
          test "$(find "$stage_project/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 2
          echo "project=$stage_project" >> "$GITHUB_OUTPUT"
          echo "E23.5: two canonical baseline files staged; full candidate tested separately; no E10.10 or hosted connection." >> "$GITHUB_STEP_SUMMARY"

      - name: Start E23.5 isolated PostgreSQL
        if: ${{ github.event.pull_request.head.ref == 'codex-app/e23-5-retirada-graphql' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "${{ steps.stage_graphql.outputs.project }}" start \
            -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/e23-5-supabase-start.log" 2>&1 || {
              tail -n 30 "$RUNNER_TEMP/e23-5-supabase-start.log" \
                | sed -E '/(SERVICE_ROLE|ANON_KEY|SECRET_KEY|JWT_SECRET|DB_PASSWORD|DATABASE_URL|PUBLISHABLE_KEY)/Id'
              exit 1
            }

      - name: Prove GraphQL retirement and preservation
        if: ${{ github.event.pull_request.head.ref == 'codex-app/e23-5-retirada-graphql' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t db_containers < <(docker ps --format '{{.Names}}' | grep '^supabase_db_' || true)
          test "${#db_containers[@]}" -eq 1
          bash supabase/tests/e23_5_retire_unused_graphql.proof.sh "${db_containers[0]}"

  e10-12-sql-proof:
    name: E10.12 PostgreSQL 17 proof
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'codex-app/e10-12-contexto-conta' || github.event.pull_request.head.ref == 'codex-app/e10-12-correcao-apply' || github.event.pull_request.head.ref == 'codex-app/e10-12-agente-vendedor' || github.event.pull_request.head.ref == 'codex-app/e10-12-rpc-acl') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.106.0
      - name: Stage exact E10.12 dependency chain
        id: e1012
        shell: bash
        run: |
          set -euo pipefail
          stage_project="$(mktemp -d "$RUNNER_TEMP/e10-12-sql.XXXXXX")"
          mkdir -p "$stage_project/supabase/migrations"
          cp supabase/config.toml "$stage_project/supabase/config.toml"
          selected=(
            20260611172930_remote_public_baseline.sql
            20260614124000_fix_audit_context_event_event_column.sql
            20260628184945_e9_commercial_entitlements.sql
            20260820190422_e21_2_3_openai_workload_operational_configurations.sql
            20260823144334_e21_2_5_openai_model_catalog.sql
            20260911150000_e21_5_3_openai_active_cost_tracking.sql
            20260920223653_e10_9_pending_setup_conversation.sql
            20260921170115_e10_9_pending_setup_openai_call_counter.sql
            20260927145500_e25_1_account_communication_bases.sql
            20260927163500_e21_2_communication_base_workloads.sql
            20260928161504_e10_11_pending_setup_business_name.sql
          )
          for name in "${selected[@]}"; do
            cp "supabase/migrations/$name" "$stage_project/supabase/migrations/$name"
            cmp -s "supabase/migrations/$name" "$stage_project/supabase/migrations/$name"
          done
          test "$(find "$stage_project/supabase/migrations" -name '*.sql' | wc -l)" -eq 11
          echo "project=$stage_project" >> "$GITHUB_OUTPUT"
      - name: Apply integral SQL to isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "${{ steps.e1012.outputs.project }}" start \
            -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/e10-12-start.log" 2>&1 || {
              sed -E '/(SERVICE_ROLE|ANON_KEY|SECRET_KEY|JWT_SECRET|DB_PASSWORD|DATABASE_URL|PUBLISHABLE_KEY)/Id' "$RUNNER_TEMP/e10-12-start.log" | tail -n 35
              exit 1
            }
          mapfile -t db_containers < <(docker ps --format '{{.Names}}' | grep '^supabase_db_')
          test "${#db_containers[@]}" -eq 1
          db_container="${db_containers[0]}"
          test "$(docker exec "$db_container" psql -U postgres -d postgres -At -c "select current_setting('server_version_num')::int / 10000 = 17")" = t
          # Exact canonical helper only; unrelated historical patch targets are outside this isolated fixture.
          awk '/^do \$migration\$/ { blocks++; if (blocks == 2) exit } { print }' \
            supabase/migrations/20260827203000_postgrest_safe_application_conflicts.sql \
            | docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/e10_12_initial_attendance.pre-migration.sql
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261007153217_e10_12_account_context_attendance.sql
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/e10_12_initial_attendance.test.sql > "$RUNNER_TEMP/e10-12-test.log" 2>&1 || {
              tail -n 60 "$RUNNER_TEMP/e10-12-test.log"; exit 1;
            }
          grep -qx 'ROLLBACK' "$RUNNER_TEMP/e10-12-test.log"
          # Reproduce the hosted default privilege that the incremental RPC inherited.
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "create role ai_readonly; alter default privileges for role postgres in schema public grant execute on functions to ai_readonly;"
          # Applied migrations remain immutable; the ACL correction is forward-only.
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261009171607_e10_12_sales_attendance.sql
          test "$(docker exec "$db_container" psql -U postgres -d postgres -At -c "select has_function_privilege('ai_readonly','public.commit_account_pending_setup_turn_v3(uuid,uuid,uuid,bigint,uuid,text,text,text,text,text,jsonb,boolean,boolean,uuid)','execute')")" = t
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261009204000_e10_12_restrict_attendance_commit_acl.sql
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/e10_12_sales_attendance.test.sql > "$RUNNER_TEMP/e10-12-sales-test.log" 2>&1 || {
              tail -n 70 "$RUNNER_TEMP/e10-12-sales-test.log"; exit 1;
            }
          grep -qx 'ROLLBACK' "$RUNNER_TEMP/e10-12-sales-test.log"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/e10_12_initial_attendance.concurrency.sql
          for suffix in a b; do
            docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "supabase/tests/e10_12_initial_attendance.commit-$suffix.sql" \
              > "$RUNNER_TEMP/e10-12-race-$suffix.log" 2>&1 &
            if [ "$suffix" = a ]; then pid_a=$!; else pid_b=$!; fi
          done
          wait "$pid_a" || { cat "$RUNNER_TEMP/e10-12-race-a.log"; exit 1; }
          wait "$pid_b" || { cat "$RUNNER_TEMP/e10-12-race-b.log"; exit 1; }
          test "$(docker exec "$db_container" psql -U postgres -d postgres -At -v ON_ERROR_STOP=1 -c "select count(*)=2 from public.business_taxons where name like 'E1012 Race %'")" = t
          test "$(docker exec "$db_container" psql -U postgres -d postgres -At -v ON_ERROR_STOP=1 -c "select count(*)=2 and count(distinct taxon_id)=1 from public.account_taxonomy where account_id in ('e1012ace-0000-4000-8000-000000000011','e1012ace-0000-4000-8000-000000000012')")" = t
          echo "E10.12: integral migration, rollback cases and two simultaneous PostgreSQL sessions passed on PostgreSQL 17; no hosted connection or target writes." >> "$GITHUB_STEP_SUMMARY"

  e25-3-sql-proof:
    name: PB1 PostgreSQL 17 proof
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex-app/e25-3-d14d-pb1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.106.0
      - name: Stage isolated Supabase project
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          stage_project="$(mktemp -d "$RUNNER_TEMP/e25-3-sql.XXXXXX")"
          mkdir -p "$stage_project/supabase/migrations"
          cp supabase/config.toml "$stage_project/supabase/config.toml"
          echo "project=$stage_project" >> "$GITHUB_OUTPUT"
      - name: Start isolated PostgreSQL and execute exact PB1 migration
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "${{ steps.stage.outputs.project }}" start \
            -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/e25-3-start.log" 2>&1 || {
              tail -n 35 "$RUNNER_TEMP/e25-3-start.log" | sed -E '/(SERVICE_ROLE|ANON_KEY|SECRET_KEY|JWT_SECRET|DB_PASSWORD|DATABASE_URL|PUBLISHABLE_KEY)/Id'
              exit 1
            }
          mapfile -t db_containers < <(docker ps --format '{{.Names}}' | grep '^supabase_db_')
          test "${#db_containers[@]}" -eq 1
          db_container="${db_containers[0]}"
          test "$(docker exec "$db_container" psql -U postgres -d postgres -At -c "select current_setting('server_version_num')::int / 10000 = 17")" = t
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "create role ai_readonly; alter default privileges in schema public grant all on tables to service_role;"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261010202505_e25_3_communication_resources.sql
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/e25_3_communication_resources.test.sql > "$RUNNER_TEMP/e25-3-test.log" 2>&1 || {
              tail -n 60 "$RUNNER_TEMP/e25-3-test.log"
              exit 1
            }
          grep -qx 'ROLLBACK' "$RUNNER_TEMP/e25-3-test.log"
          echo "Exact PB1 migration and rollback cases passed on isolated Supabase PostgreSQL 17: catalog ACL, identity, order, stale edit, private bucket metadata. Auth/Storage services and UI are not emulated." >> "$GITHUB_STEP_SUMMARY"
      - name: Stop disposable database
        if: ${{ always() && steps.stage.outputs.project != '' }}
        shell: bash
        run: supabase --workdir "${{ steps.stage.outputs.project }}" stop --no-backup
