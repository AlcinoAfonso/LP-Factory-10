name: Temporary E20.2 planning refinement

on:
  push:
    branches:
      - agent/reconciliar-e19-2-planejamento
    paths:
      - .github/workflows/tmp-refine-e20-order.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reconciliar-e19-2-planejamento
          fetch-depth: 0

      - name: Apply deterministic planning refinement
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/lp-planejamento.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
          '''- Preservar o catálogo declarativo, suas camadas, resolução por taxon e plano, proveniência, validação e barreira de admissão já concluídos.
- Não copiar os campos resolvidos para o perfil da E20.3.
- Refinar focalmente o catálogo para a E19.2 quando necessário para representar serviço ou oferta principal, descrição factual curta, logo opcional e paleta confirmada, com escopo, origem, tipo, validação, obrigação, plano e snapshot definidos.
- Não criar catálogo completo de produtos, serviços, mídias ou identidade visual antes de necessidade real.
- Valores operacionais, avaliação das condições concretas e snapshot permanecem para a E19.''':
          '''- Preservar o catálogo declarativo, suas camadas, resolução por taxon e plano, proveniência, validação e barreira de admissão já concluídos.
- Não copiar os campos resolvidos para o perfil da E20.3.
- Refinar a E20.2 antes do plano-base da E19.2 para definir os campos mínimos do Starter:
  - serviço ou oferta principal, obrigatório;
  - descrição factual curta do que o negócio realmente entrega, obrigatória;
  - logo ou asset da marca, opcional;
  - identidade ou paleta visual confirmada, obrigatória mesmo sem logo e reutilizável como padrão da conta.
- Para cada campo, fechar escopo, origem esperada, tipo, validação, obrigação, planos aplicáveis e política de snapshot.
- A E20.2 define e resolve os campos; a E19.2 coleta, valida e persiste os valores concretos.
- Não criar catálogo completo de produtos, serviços, mídias ou identidade visual antes de necessidade real.
- Upload, armazenamento do asset, geração ou confirmação da paleta, persistência dos valores e completude derivada pertencem à E19.2, não à E20.2.''',
          '''- A E19.2 cria a experiência pós-entitlement da conta e prepara os valores reutilizáveis do negócio e o brief mínimo da primeira LP Starter, sem gerar conteúdo.
- Substituir a permanência na página comercial por onboarding quando houver entitlement válido e configuração incompleta; depois da conclusão, direcionar ao espaço operacional da E19.''':
          '''- A E19.2 cria a experiência pós-entitlement da conta e prepara os valores reutilizáveis do negócio e o brief mínimo da primeira LP Starter, sem gerar conteúdo.
- A E19.2 consome o catálogo E20.2 já refinado, coleta somente os campos aplicáveis, valida e persiste seus valores concretos.
- Substituir a permanência na página comercial por onboarding quando houver entitlement válido e configuração incompleta; depois da conclusão, direcionar ao espaço operacional da E19.''',
          '''- Base consolidada para a jornada: E10.8, E18.4, E18.5, E20.2, E20.3, incluindo E20.3.5, E12.4.3, incluindo E12.4.3.1–12.4.3.2, e E19.1.
- 1º — preparar o plano-base v1 da E19.2 para onboarding e configuração mínima Starter e reconciliar no mesmo PR as referências ativas do roadmap, preservando como históricos os planos já encerrados.
- 2º — no plano-base, fechar contratos de valores, logo, paleta, escopos, persistência, completude, progressive disclosure e transição da página comercial para o espaço operacional.
- 3º — implementar a E19.2 em fases pequenas, sem geração de conteúdo.
- 4º — validar o onboarding com a conta piloto e confirmar que o brief mínimo Starter está completo.
- 5º — avaliar e preparar o plano-base da evolução posterior da E19 para composição, geração, revisão, materialização e publicação.
- 6º — gerar e avaliar a primeira LP piloto pelo fluxo oficial da E19.
- 7º — planejar a disponibilidade comercial por `taxon + plano` em E20.4 e E12.4.5–12.4.6.
- A E12.4.4 é retirada da implementação e absorvida pela jornada simplificada; não é concluída nem bloqueia a E19.2.
- Reabrir E18.4, E18.5 ou o perfil de orientação somente diante de aprendizado material obtido com LPs reais. A E20.2 pode receber refinamento focalizado durante o planejamento ou a implementação da E19.2 quando houver consumidor real, necessidade concreta e aprovação pela barreira de admissão vigente.''':
          '''- Base consolidada para a jornada: E10.8, E18.4, E18.5, E20.2 v1, E20.3, incluindo E20.3.5, E12.4.3, incluindo E12.4.3.1–12.4.3.2, e E19.1.
- 1º — preparar e implementar o refinamento focalizado da E20.2 para os campos mínimos Starter: serviço ou oferta principal, descrição factual curta, logo opcional e identidade ou paleta visual confirmada.
- 2º — preparar o plano-base v1 da E19.2 consumindo o catálogo E20.2 refinado e reconciliar no mesmo PR as referências ativas do roadmap, preservando como históricos os planos já encerrados.
- 3º — no plano-base da E19.2, fechar persistência dos valores, armazenamento e remoção da logo, sugestão e confirmação da paleta, completude derivada, progressive disclosure e transição da página comercial para o espaço operacional.
- 4º — implementar a E19.2 em fases pequenas, sem geração de conteúdo.
- 5º — validar o onboarding com a conta piloto e confirmar que o brief mínimo Starter está completo.
- 6º — avaliar e preparar o plano-base da evolução posterior da E19 para composição, geração, revisão, materialização e publicação.
- 7º — gerar e avaliar a primeira LP piloto pelo fluxo oficial da E19.
- 8º — planejar a disponibilidade comercial por `taxon + plano` em E20.4 e E12.4.5–12.4.6.
- A E12.4.4 é retirada da implementação e absorvida pela jornada simplificada; não é concluída nem bloqueia a E19.2.
- Reabrir E18.4, E18.5 ou o perfil de orientação somente diante de aprendizado material obtido com LPs reais. Depois do refinamento mínimo anterior à E19.2, novos ajustes na E20.2 dependem de consumidor real, necessidade concreta e aprovação pela barreira de admissão vigente.'''
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Validate and self-remove
        run: |
          grep -Fq 'A E20.2 define e resolve os campos; a E19.2 coleta, valida e persiste os valores concretos.' docs/lp-planejamento.md
          grep -Fq '1º — preparar e implementar o refinamento focalizado da E20.2' docs/lp-planejamento.md
          git diff --check
          rm .github/workflows/tmp-refine-e20-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/lp-planejamento.md .github/workflows/tmp-refine-e20-order.yml
          git commit -m 'docs: priorizar refinamento E20.2 antes da E19.2'
          git push origin HEAD:agent/reconciliar-e19-2-planejamento
