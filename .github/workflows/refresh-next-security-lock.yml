name: Refresh Next security lock

on:
  push:
    branches:
      - codex-app/next-16-2-11-security

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm target versions
        id: target
        shell: bash
        run: |
          node - <<'NODE'
          const pkg = require('./package.json')
          const ready = pkg.dependencies.next === '16.2.11' && pkg.dependencies['eslint-config-next'] === '16.2.11'
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\n`)
          NODE

      - name: Refresh only Next packages in lockfile
        if: steps.target.outputs.ready == 'true'
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.2.11 eslint-config-next@16.2.11

      - name: Install from lockfile
        if: steps.target.outputs.ready == 'true'
        run: npm ci --ignore-scripts

      - name: Run project checks
        if: steps.target.outputs.ready == 'true'
        run: npm run check

      - name: Commit generated lockfile
        if: steps.target.outputs.ready == 'true'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: atualiza lockfile do Next.js"
          git push
